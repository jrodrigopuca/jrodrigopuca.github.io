<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Part 2 Drills</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --bg: #F2F4F8;
    --paper: #FFFFFF;
    --paper-2: #E9EDF4;
    --ink: #171C28;
    --ink-2: #5B6478;
    --line: #D9DEE8;
    --accent: #2148C8;
    --accent-soft: #E3E9FB;
    --accent-ink: #FFFFFF;
    --mark: #FFD54A;
    --mark-ink: #3A2E00;
    --good: #1E7F55;
    --good-bg: #E3F5EB;
    --bad: #C4372B;
    --bad-bg: #FBE7E4;
    --shadow: 0 1px 2px rgba(23,28,40,.06), 0 8px 24px rgba(23,28,40,.08);
    --display: "Bricolage Grotesque", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11141B; --paper: #1A1F2B; --paper-2: #232A39; --ink: #E9EDF5; --ink-2: #9AA4B8;
      --line: #2C3446; --accent: #8AA4FF; --accent-soft: #22304F; --accent-ink: #0E1320;
      --mark: #E9C43A; --mark-ink: #2A2100; --good: #5AC38C; --good-bg: #17301F;
      --bad: #F08A7E; --bad-bg: #3A1E1B;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11141B; --paper: #1A1F2B; --paper-2: #232A39; --ink: #E9EDF5; --ink-2: #9AA4B8;
    --line: #2C3446; --accent: #8AA4FF; --accent-soft: #22304F; --accent-ink: #0E1320;
    --mark: #E9C43A; --mark-ink: #2A2100; --good: #5AC38C; --good-bg: #17301F;
    --bad: #F08A7E; --bad-bg: #3A1E1B;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 32px 32px;
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.5;
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.1; }
  .app { max-width: 1040px; margin: 0 auto; padding: 28px 20px 64px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
  .muted { color: var(--ink-2); }

  /* Buttons */
  .btn { border: 1.5px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; transition: transform .08s ease, background .15s ease; }
  .btn:hover { background: var(--paper-2); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.mark { background: var(--mark); color: var(--mark-ink); border-color: var(--mark); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
  .btn.ghost:hover { background: var(--paper-2); color: var(--ink); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.sm { padding: 7px 12px; font-size: 15px; }

  /* Header */
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .brand h1 { font-size: 44px; font-weight: 800; letter-spacing: -.02em; }
  .brand h1 span { color: var(--accent); }
  .brand p { margin: 6px 0 0; color: var(--ink-2); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat { background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat .v { font-family: var(--mono); font-size: 26px; font-weight: 700; line-height: 1; margin-top: 6px; }
  .stat .v small { font-size: 13px; color: var(--ink-2); font-weight: 500; margin-left: 4px; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 36px; }

  .unit { margin-bottom: 36px; }
  .unit-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
  .unit-head h2 { font-size: 26px; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .topic { background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; padding: 16px 18px 14px; display: grid; gap: 10px; position: relative; }
  .topic .tag { position: absolute; top: -10px; left: 16px; background: var(--paper-2); border: 1.5px solid var(--line); border-radius: 999px; padding: 1px 10px; font-size: 12px; font-family: var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
  .topic.grammar .tag { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .topic h3 { font-size: 20px; font-weight: 700; margin-top: 4px; }
  .topic .meta { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-2); }
  .bar { height: 8px; background: var(--paper-2); border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--mark); border-radius: 999px; transition: width .4s ease; }
  .topic .row { display: flex; gap: 8px; }

  /* Session */
  .session { max-width: 680px; margin: 0 auto; }
  .session-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .session-top .progress { flex: 1; }
  .session-top .count { font-family: var(--mono); font-size: 14px; color: var(--ink-2); white-space: nowrap; }
  .card { background: var(--paper); border: 1.5px solid var(--line); border-radius: 16px; padding: 26px 28px; box-shadow: var(--shadow); }
  .card .prompt { color: var(--ink-2); font-size: 15px; margin-bottom: 8px; }
  .card .big { font-family: var(--display); font-size: 28px; font-weight: 700; line-height: 1.25; margin-bottom: 20px; }
  .card .big em { font-style: normal; color: var(--accent); border-bottom: 3px solid var(--mark); }
  .card .big .gap { display: inline-block; min-width: 3.5em; border-bottom: 3px solid var(--accent); vertical-align: baseline; }
  .options { display: grid; gap: 10px; }
  .opt { text-align: left; border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; transition: background .12s ease, border-color .12s ease; }
  .opt:hover:not(:disabled) { background: var(--paper-2); border-color: var(--ink-2); }
  .opt .k { font-family: var(--mono); font-size: 12px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; flex-shrink: 0; }
  .opt.good { background: var(--good-bg); border-color: var(--good); }
  .opt.bad { background: var(--bad-bg); border-color: var(--bad); }
  .opt:disabled { cursor: default; }
  .typed { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .typed .stem { font-family: var(--display); font-weight: 700; font-size: 19px; color: var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; }
  .typed.with-stem input { flex: 1 1 240px; }
  .keyword { display: flex; align-items: center; gap: 10px; margin: -6px 0 14px; }
  .key { font-family: var(--mono); font-weight: 700; letter-spacing: .1em; background: var(--mark); color: var(--mark-ink); border-radius: 8px; padding: 4px 10px; }
  .typed.cam { display: block; }
  .typed.cam .pre, .typed.cam .post { font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.6; }
  .typed.cam input { display: inline-block; width: min(100%, 22ch); margin: 4px 8px; font-size: 18px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--accent); background: var(--paper); color: var(--ink); vertical-align: baseline; }
  .typed.cam button { display: block; margin-top: 12px; }
  .hint.warn { color: var(--bad); letter-spacing: 0; font-family: var(--body); font-weight: 700; }
  .typed input { flex: 1; font: inherit; font-size: 18px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink); min-width: 0; }
  .hint { margin-top: 10px; font-family: var(--mono); font-size: 15px; color: var(--ink-2); letter-spacing: .08em; min-height: 1.4em; }
  .helper { display: flex; gap: 8px; margin-top: 12px; }

  .feedback { margin-top: 18px; border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; border: 1.5px solid; }
  .feedback.good { background: var(--good-bg); border-color: var(--good); }
  .feedback.bad { background: var(--bad-bg); border-color: var(--bad); }
  .feedback .title { font-family: var(--display); font-weight: 800; font-size: 18px; }
  .feedback.good .title { color: var(--good); }
  .feedback.bad .title { color: var(--bad); }
  .feedback .next { justify-self: end; margin-top: 6px; }
  .feedback .forms { margin: 2px 0 4px; padding-left: 18px; display: grid; gap: 2px; }
  .feedback .forms b { color: var(--ink); }

  /* Matching */
  .match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .match .col { display: grid; gap: 10px; align-content: start; }
  .tile { border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 12px; min-height: 52px; text-align: left; transition: background .12s ease; }
  .tile:hover:not(:disabled) { background: var(--paper-2); }
  .tile.sel { border-color: var(--accent); background: var(--accent-soft); }
  .tile.done { background: var(--good-bg); border-color: var(--good); color: var(--ink-2); }
  .tile.shake { animation: shake .3s ease; border-color: var(--bad); }
  @keyframes shake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-5px);} 75% { transform: translateX(5px);} }
  .match-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }

  /* Flashcards */
  .flash { perspective: 1200px; margin: 16px 0; }
  .flash .inner { position: relative; min-height: 260px; transition: transform .45s ease; transform-style: preserve-3d; cursor: pointer; }
  .flash.flipped .inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; background: var(--paper); border: 1.5px solid var(--line); border-radius: 16px; padding: 28px; display: grid; align-content: center; gap: 12px; box-shadow: var(--shadow);
    background-image: repeating-linear-gradient(transparent 0 31px, var(--line) 31px 32px); }
  .face.back { transform: rotateY(180deg); background-image: none; background: var(--accent-soft); }
  .face .term { font-family: var(--display); font-size: 30px; font-weight: 700; }
  .face .def { font-size: 18px; }
  .face .ex { font-style: italic; color: var(--ink-2); }
  .face .ex b { font-style: normal; color: var(--accent); }
  .flash-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* Result */
  .result { text-align: center; display: grid; gap: 18px; }
  .result h2 { font-size: 40px; font-weight: 800; }
  .result .score { font-family: var(--mono); font-size: 64px; font-weight: 700; line-height: 1; color: var(--accent); }
  .result .score small { font-size: 22px; color: var(--ink-2); }
  .missed { text-align: left; display: grid; gap: 8px; margin-top: 8px; }
  .missed li { background: var(--paper-2); border-radius: 10px; padding: 10px 12px; list-style: none; }
  .missed li b { color: var(--good); }
  .result .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; box-shadow: var(--shadow); opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  @media (max-width: 720px) {
    body { font-size: 16px; }
    .brand h1 { font-size: 34px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .card { padding: 20px; }
    .card .big { font-size: 23px; }
    .match { gap: 8px; }
    .tile { padding: 10px; font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONTENIDO — modelado desde Part-2.md
   ========================================================= */
const P = {
  that: 'verb + that + clause',
  objThat: 'verb + object + that + clause',
  toInf: 'verb + to-infinitive',
  objToInf: 'verb + object + to-infinitive',
  ger: 'verb + gerund (-ing)',
  prepGer: 'verb + preposition + gerund',
  objPrepGer: 'verb + object + preposition + gerund',
};
const TENSES = ['Present perfect simple', 'Present perfect continuous', 'Past perfect simple', 'Past perfect continuous', 'Future perfect simple', 'Future perfect continuous'];

const TOPICS = [
  /* ---------------- UNIT 9 ---------------- */
  {
    id: 'compound', unit: 9, title: 'Compound nouns', kind: 'vocab',
    items: [
      { a: 'Artificial', b: 'intelligence', g: 'machines that perform tasks needing human-like thinking' },
      { a: 'Big', b: 'data', g: 'extremely large data sets analysed to reveal patterns' },
      { a: 'Computer', b: 'algorithm', g: 'a step-by-step set of instructions a computer follows' },
      { a: 'Facial', b: 'recognition', g: 'technology that identifies people from their faces' },
      { a: 'Machine', b: 'learning', g: 'systems that improve from data without explicit programming' },
      { a: 'Search', b: 'engine', g: 'a tool that finds web pages matching your query' },
      { a: 'Social media', b: 'feed', g: 'the stream of posts you see on a social network' },
      { a: 'Streaming', b: 'platform', g: 'a service that plays audio or video over the internet' },
      { a: 'Video', b: 'platform', g: 'a website where users upload and watch videos' },
      { a: 'Virtual', b: 'assistant', g: 'software that answers questions and performs tasks by voice or text' },
      { a: 'Voice', b: 'recognition', g: 'technology that understands spoken words' },
      { a: 'Web', b: 'browser', g: 'the program you use to visit websites' },
    ],
    cards: t => t.items.map(i => ({ front: `${i.a} ${i.b}`, def: i.g })),
    gens: (t, it) => {
      const all = t.items;
      return [
        () => mc(`Completá el compound noun`, `${it.a} <span class="gap"></span>`, it.b,
          distract(uniq(all.map(x => x.b)), [it.b], 3), `<b>${it.a} ${it.b}</b>: ${it.g}`),
        () => {
          const valid = all.filter(x => x.b === it.b).map(x => x.a);
          return mc(`Completá el compound noun`, `<span class="gap"></span> ${it.b}`, it.a,
            distract(all.map(x => x.a), valid, 3), `<b>${it.a} ${it.b}</b>: ${it.g}`);
        },
        () => typed(`Escribí la segunda parte`, `${it.a} <span class="gap"></span>`, [it.b], it.g, `<b>${it.a} ${it.b}</b>: ${it.g}`),
      ];
    },
    match: t => t.items.map(i => [i.a, i.b]),
  },
  {
    id: 'make', unit: 9, title: 'Collocations con "make"', kind: 'vocab',
    items: [
      { c: 'predictions', es: 'hacer predicciones', s: 'Weather models make ___ about tomorrow\'s rain.' },
      { c: 'a connection', es: 'hacer una conexión / relacionar', s: 'It took me a minute to make ___ between the two events.' },
      { c: 'sense', es: 'tener sentido', s: 'Your explanation doesn\'t make ___ to me.' },
      { c: 'mistakes', es: 'cometer errores', s: 'Everyone makes ___ when learning a new language.' },
      { c: 'an observation', es: 'hacer una observación', s: 'The scientist made ___ before drawing any conclusions.' },
      { c: 'generalizations', es: 'generalizar', s: 'Don\'t make ___ about people based on one meeting.' },
      { c: 'our life easier', es: 'hacernos la vida más fácil', s: 'Smart assistants make ___ by handling boring tasks.' },
      { c: 'decisions', es: 'tomar decisiones', s: 'Managers have to make ___ quickly under pressure.' },
    ],
    cards: t => t.items.map(i => ({ front: `make ${i.c}`, def: i.es, ex: i.s.replace('___', `<b>${i.c}</b>`) })),
    gens: (t, it) => [
      () => mc(`Elegí la collocation correcta`, gapify(it.s), it.c, distract(t.items.map(x => x.c), [it.c], 3), `<b>make ${it.c}</b> — ${it.es}`),
      () => typed(`Completá con la collocation de "make"`, gapify(it.s), [it.c], it.es, `<b>make ${it.c}</b> — ${it.es}`),
      () => mc(`¿Cómo se dice en inglés?`, `${it.es}`, `make ${it.c}`, distract(t.items.map(x => `make ${x.c}`), [`make ${it.c}`], 3), `<b>make ${it.c}</b>`),
    ],
    match: t => t.items.map(i => [`make ${i.c}`, i.es]),
  },
  {
    id: 'tech', unit: 9, title: 'Using technology (sinónimos)', kind: 'vocab',
    items: [
      { a: 'Analyse data', b: 'Examine the data' },
      { a: 'Attend a webinar', b: 'Be present at a webinar' },
      { a: 'Browse the internet', b: 'Surf the internet' },
      { a: 'Enable voice recognition', b: 'Allow voice recognition' },
      { a: 'Resolve an issue', b: 'Fix an issue' },
      { a: 'Run an application', b: 'Operate an application' },
      { a: 'Save a document', b: 'Store a document' },
      { a: 'Search for information', b: 'Look for information' },
      { a: 'Stream a video', b: 'Access a video online' },
    ],
    cards: t => t.items.map(i => ({ front: i.a, def: `= ${i.b}` })),
    gens: (t, it) => [
      () => mc(`¿Cuál significa lo mismo?`, `<em>${it.a}</em>`, it.b, distract(t.items.map(x => x.b), [it.b], 3), `<b>${it.a}</b> = ${it.b}`),
      () => mc(`¿Cuál significa lo mismo?`, `<em>${it.b}</em>`, it.a, distract(t.items.map(x => x.a), [it.a], 3), `<b>${it.a}</b> = ${it.b}`),
      () => typed(`Escribí el verbo que falta`, gapify(it.a.replace(/^\w+/, '___')), [it.a.split(' ')[0]], `= ${it.b}`, `<b>${it.a}</b> = ${it.b}`),
    ],
    match: t => t.items.map(i => [i.a, i.b]),
  },
  {
    id: 'adverbs', unit: 9, title: 'Adverbios: high/highly, hard/hardly…', kind: 'grammar',
    items: [
      { w: 'high', pair: 'highly', m: 'above something (position)', ex: ['The shelf is mounted ___ on the wall.', 'The eagle was flying ___ above the valley.'] },
      { w: 'highly', pair: 'high', m: 'to a high degree, very much', ex: ['He is a ___ skilled engineer.', 'This restaurant is ___ recommended.'] },
      { w: 'just', pair: 'justly', m: 'simply', ex: ['I ___ wanted to say hello.', 'It\'s ___ a small scratch, don\'t worry.'] },
      { w: 'justly', pair: 'just', m: 'fairly', ex: ['The winner was ___ rewarded.', 'The judge treated both sides ___.'] },
      { w: 'hard', pair: 'hardly', m: 'with a lot of effort', ex: ['She worked ___ to finish the project.', 'It\'s raining ___ outside.'] },
      { w: 'hardly', pair: 'hard', m: 'almost not', ex: ['I could ___ hear what he was saying.', 'There was ___ any food left.'] },
      { w: 'late', pair: 'lately', m: 'after the expected time', ex: ['He arrived ___ for the meeting.', 'The train left ___ last night.'] },
      { w: 'lately', pair: 'late', m: 'recently', ex: ['Have you seen him ___?', 'I haven\'t been sleeping well ___.'] },
      { w: 'close', pair: 'closely', m: 'near, a short distance away', ex: ['The school is ___ to my house.', 'Stay ___ to me in the crowd.'] },
      { w: 'closely', pair: 'close', m: 'very carefully', ex: ['They were ___ monitored by the security team.', 'The two theories are ___ related.'] },
    ],
    cards: t => t.items.map(i => ({ front: i.w, def: i.m, ex: i.ex[0].replace('___', `<b>${i.w}</b>`) })),
    gens: (t, it) => [
      () => mc(`¿${it.w} o ${it.pair}?`, gapify(pick(it.ex)), it.w, [it.pair], `<b>${it.w}</b> = ${it.m}. <b>${it.pair}</b> = ${t.items.find(x => x.w === it.pair).m}.`),
      () => mc(`¿Qué adverbio significa "${it.m}"?`, ``, it.w, distract(t.items.map(x => x.w), [it.w], 3), `<b>${it.w}</b> = ${it.m}`),
      () => typed(`Completá con el adverbio correcto`, gapify(pick(it.ex)), [it.w], it.m, `<b>${it.w}</b> = ${it.m}`),
    ],
    match: t => t.items.map(i => [i.w, i.m]),
  },
  {
    id: 'problems', unit: 9, title: 'Problems with technology', kind: 'vocab',
    items: [
      { w: 'backup', d: 'a copy of data kept in case the original is lost' },
      { w: 'firewall', d: 'software or hardware that blocks unauthorised access to a network' },
      { w: 'bug', d: 'an error in a program that makes it behave incorrectly' },
      { w: 'spam', d: 'unwanted messages sent in bulk, usually by email' },
      { w: 'spyware', d: 'software that secretly collects information about a user' },
      { w: 'virus', d: 'a malicious program that copies itself and damages systems' },
      { w: 'cookie', d: 'a small file a website stores in your browser to remember you' },

      { s: '“I lost my keys while running to the station,” she said.', key: 'HAD', pre: 'She admitted that she', post: 'while running to the station.', a: ['had lost her keys'], rule: 'Past Simple → Past Perfect. my → her.' },
      { s: '“I can resolve this bug by tomorrow,” he said.', key: 'FOLLOWING', pre: 'He explained that he could resolve that bug by', post: '.', a: ['the following day'], rule: 'can → could. this → that. tomorrow → the following day.' },
      { s: '“We\'ll buy a 3D TV next year,” they said.', key: 'WOULD', pre: 'They said that they', post: 'the following year.', a: ['would buy a 3D TV'], rule: 'will → would. next year → the following year.' },
      { s: '“I must complete the update before the system reboots,” she said.', key: 'HAD', pre: 'She mentioned that she', post: 'the update before the system rebooted.', a: ['had to complete'], rule: 'must → had to. La subordinada también se atrasa: reboots → rebooted.' },
      { s: '“I would help you with the code if I had more time,” he told me.', key: 'ME', pre: 'He said that he', post: 'with the code if he had more time.', a: ['would help me'], rule: 'would no cambia. you → me, I → he.' },
      { s: '“Did you fix your Wi-Fi?” he asked me.', key: 'WHETHER', pre: 'He asked me', post: 'my Wi-Fi.', a: ['whether I had fixed'], rule: 'Yes/No question: ask + if/whether + orden afirmativo. Past Simple → Past Perfect.' },
      { s: '“Where did you save the document?” she asked me.', key: 'HAD', pre: 'She asked me where', post: 'the document.', a: ['I had saved'], rule: 'Wh- question: ask + wh- + orden afirmativo, sin "did".' },
      { s: '“You should consider updating the server,” the manager told us.', key: 'SHOULD', pre: 'The manager suggested that', post: 'updating the server.', a: ['we should consider'], rule: 'should no cambia. you → we.' },
      { s: '“You had better back up your files before running the update,” she warned me.', key: 'BETTER', pre: 'She warned me that I', post: 'my files before running the update.', a: ['had better back up'], rule: 'had better no cambia. you → I, your → my.' },
      { s: '“Don\'t forget: the deadline is tomorrow,” she told me.', key: 'FOLLOWING', pre: 'She reminded me that the deadline was', post: '.', a: ['the following day'], rule: 'remind + object + that + clause. is → was. tomorrow → the following day.' },
      { s: '“I\'m sorry I arrived late,” he said.', key: 'FOR', pre: 'He apologized', post: 'late.', a: ['for arriving', 'for having arrived'], rule: 'apologize + for + gerund.' },
      { s: '“Let\'s visit the museum,” she said.', key: 'SUGGESTED', pre: 'She', post: 'the museum.', a: ['suggested visiting', 'suggested that we visit', 'suggested we visit', 'suggested we should visit', 'suggested that we should visit'], rule: 'suggest + gerund (o suggest that + clause).' },
      { s: '“You stole the files!” she said to him.', key: 'ACCUSED', pre: 'She', post: 'the files.', a: ['accused him of stealing', 'accused him of having stolen'], rule: 'accuse + object + of + gerund.' },
      { s: '“I\'ll help you with the project, I promise,” he told me.', key: 'PROMISED', pre: 'He', post: 'with the project.', a: ['promised to help me', 'promised he would help me'], rule: 'promise + to-infinitive (o promise (that) + clause). Con "that" serían 6 palabras: en el examen hay que elegir la forma que entra en el límite.' },
      { s: 'I started learning English three years ago and I\'m still learning.', key: 'BEEN', pre: 'I', post: 'English for three years.', a: ['have been learning'], rule: 'Present perfect continuous: acción que empezó en el pasado y sigue. for + duración.' },
      { s: 'The artist died. Later, I bought the sculpture.', key: 'BEFORE', pre: 'The artist', post: 'the sculpture.', a: ['had died before I bought'], rule: 'Past perfect simple: acción anterior a otra acción pasada.' },
      { s: 'We will finish the report and then the meeting will start.', key: 'HAVE', pre: 'By the time the meeting starts, we', post: 'the report.', a: ['will have finished'], rule: 'Future perfect simple: acción completada antes de un momento futuro.' },
      { s: 'This is the first time I have seen this painting.', key: 'NEVER', pre: 'I', post: 'this painting before.', a: ['have never seen'], rule: 'Present perfect + never: experiencias.' },
      { s: 'I will arrive in Buenos Aires after three months of travelling.', key: 'BEEN', pre: 'When I arrive in Buenos Aires, I', post: 'for three months.', a: ['will have been travelling', 'will have been traveling'], rule: 'Future perfect continuous: acción que continúa hasta un momento futuro.' },
      { s: 'He worked on the portrait for months. Then he finished it.', key: 'BEEN', pre: 'He', post: 'on the portrait for months before he finished it.', a: ['had been working'], rule: 'Past perfect continuous: actividad en curso que lleva a un evento pasado.' },
      { s: 'The last time I visited my grandparents\' home town was ten years ago.', key: 'FOR', pre: 'I haven\'t visited my grandparents\' home town', post: '.', a: ['for ten years', 'for 10 years'], rule: 'Present perfect negativo + for + duración: hace X tiempo que no…' },
      { s: 'I bought this photo of my aunt over 20 years ago and I still have it.', key: 'HAD', pre: 'I', post: 'of my aunt for over 20 years.', a: ['have had this photo'], rule: 'Present perfect simple: estado que empezó en el pasado y continúa.' },
      { s: 'You\'re covered in flour. Were you cooking just now?', key: 'BEEN', pre: 'You\'re covered in flour.', post: '?', a: ['Have you been cooking'], rule: 'Present perfect continuous: acción reciente que explica una evidencia.' },
      { s: 'She opened the shop in 2015 and she still makes Russian dolls there.', key: 'MAKING', pre: 'She has', post: 'Russian dolls there since 2015.', a: ['been making'], rule: 'Present perfect continuous: acciones repetidas desde un punto (since).' },
      { s: 'I inherited this painting and it has been in my bedroom ever since.', key: 'HANGING', pre: 'This painting', post: 'in my bedroom since I inherited it.', a: ['has been hanging'], rule: 'Present perfect continuous + since: acción que empezó en el pasado y sigue.' },
    ],
    cards: t => t.items.map(i => ({ front: `${esc(i.s)}<br><span class="key">${i.key}</span>`, def: `${esc(i.pre)} <b>${esc(i.a[0])}</b> ${esc(i.post)}`, ex: esc(i.rule) })),
    gens: (t, it) => [() => transform(t, it)],
  },
];

const UNITS = [
  { n: 9, title: 'Unit 9', sub: 'Technology, reported speech' },
  { n: 1, title: 'Unit 1', sub: 'Who am I? Belonging, change, perfect aspect' },
  { n: 0, title: 'Desafío', sub: 'Reescribí oraciones sin cambiar el significado' },

/* =========================================================
   HELPERS
   ========================================================= */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const uniq = a => [...new Set(a)];
const distract = (pool, exclude, n) => shuffle(uniq(pool).filter(x => !exclude.includes(x))).slice(0, n);
const gapify = s => esc(s).replace(/___/g, '<span class="gap"></span>');
const norm = s => String(s).toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
function fill(s, a, bold) {
  const parts = a.split(' / ');
  let out = s;
  parts.forEach(p => { out = out.replace('___', bold ? `<b>${p}</b>` : p); });
  return out;
}
function exFill(i) {
  // fill idiom examples, accepting inflected forms
  const forms = { 'fly in the face': 'flies in the face', 'make no bones about it': 'made no bones about', 'pull their socks up': 'pull your socks up' };
  return i.ex.replace('___', `<b>${forms[i.p] || i.p}</b>`);
}
const mc = (prompt, big, answer, wrong, explain) => ({ type: 'mc', prompt, big, answer, options: shuffle([answer, ...wrong]), explain });
const typed = (prompt, big, answers, hint, explain) => ({ type: 'type', prompt, big, answers, hint, explain });
const transform = (t, it) => ({
  type: 'type', flex: true,
  prompt: `Completá la segunda oración para que signifique lo mismo que la primera, usando la palabra clave sin modificarla.`,
  big: esc(it.s),
  cam: { key: it.key, pre: it.pre, post: it.post, min: t.min, max: t.max },
  answers: it.a, hint: `Entre ${t.min} y ${t.max} palabras, incluida la clave. Las contracciones cuentan como dos.`,
  explain: `<div><b>Formas válidas</b>:</div>
    <ul class="forms">${it.a.map(a => `<li>${esc(it.pre)} <b>${esc(a)}</b> ${esc(it.post)}</li>`).join('')}</ul>
    <div>${esc(it.rule)}</div>`,
});
const modelAnswer = q => q.cam ? `${q.cam.pre} ${q.answers[0]} ${q.cam.post}` : `${q.stem ? q.stem + ' ' : ''}${q.answers[0]}`;

/* Conteo de palabras al estilo Cambridge: contracciones = dos palabras, posesivos y guiones = una */
const tokens = s => {
  let x = String(s).toLowerCase().replace(/’/g, "'");
  CONTR.forEach(([r, t]) => { x = x.replace(r, t); });
  x = x.replace(/'d\b/g, ' d').replace(/'s\b/g, '');
  return x.replace(/[^a-z0-9'\-\s]/g, ' ').split(/\s+/).filter(Boolean);
};
const wordCount = s => tokens(s).length;
const hasKey = (s, key) => variants(String(s).toLowerCase().replace(/’/g, "'")).some(v => tokens(v).includes(key.toLowerCase()));
/* Corrector flexible para transformaciones: contracciones, if/whether, "that" opcional, 'd = had/would, 's = is/has */
const CONTR = [[/won't/g, 'will not'], [/can't/g, 'cannot'], [/n't\b/g, ' not'], [/'ll\b/g, ' will'], [/'re\b/g, ' are'], [/'ve\b/g, ' have'], [/'m\b/g, ' am']];
function canon(s) {
  let x = String(s).toLowerCase().replace(/’/g, "'");
  CONTR.forEach(([r, t]) => { x = x.replace(r, t); });
  x = norm(x).replace(/\bwhether\b/g, 'if').replace(/\bthat\b/g, ' ').replace(/\s+/g, ' ').trim();
  return x;
}
function variants(s) {
  let out = [s];
  [["'d", [' had', ' would']], ["'s", [' is', ' has']]].forEach(([c, reps]) => {
    if (!s.includes(c)) return;
    out = out.concat(out.flatMap(v => reps.map(r => v.split(c).join(r))));
  });
  return out;
}
const matchFlex = (input, answers) => {
  const targets = answers.map(canon);
  return variants(String(input).toLowerCase().replace(/’/g, "'")).some(v => targets.includes(canon(v)));
};

const topicById = id => TOPICS.find(t => t.id === id);
const itemKey = (t, idx) => `${t.id}:${idx}`;

/* =========================================================
   ESTADO PERSISTENTE
   ========================================================= */
const KEY = 'part2-drills-v1';
const defaults = () => ({ xp: 0, streak: 0, lastDay: null, topics: {}, missed: {} });
let state = defaults();
try { const raw = localStorage.getItem(KEY); if (raw) state = Object.assign(defaults(), JSON.parse(raw)); } catch (e) { /* sin storage: jugamos en memoria */ }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignorar */ } };

const tstat = id => state.topics[id] || (state.topics[id] = { attempts: 0, correct: 0 });
const mastery = t => { const s = tstat(t.id); return s.attempts ? Math.round(100 * Math.min(1, s.correct / Math.max(s.attempts, t.items.length))) : 0; };
const missedCount = () => Object.keys(state.missed).length;
const today = () => new Date().toISOString().slice(0, 10);

function recordAnswer(topicId, keys, correct) {
  const s = tstat(topicId);
  s.attempts++; if (correct) s.correct++;
  keys.forEach(k => {
    if (correct) { if (state.missed[k]) { state.missed[k]--; if (state.missed[k] <= 0) delete state.missed[k]; } }
    else state.missed[k] = (state.missed[k] || 0) + 1;
  });
  if (correct) state.xp += 10;
  save();
}
function touchStreak() {
  const d = today();
  if (state.lastDay === d) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  state.streak = state.lastDay === y.toISOString().slice(0, 10) ? state.streak + 1 : 1;
  state.lastDay = d; save();
}

/* =========================================================
   ARMADO DE SESIONES
   ========================================================= */
function questionFor(t, idx) {
  const it = t.items[idx];
  const q = pick(t.gens(t, it))();
  q.topic = t.id; q.keys = [itemKey(t, idx)];
  return q;
}
function matchQuestion(t) {
  const pairs = shuffle(t.match(t).map((p, i) => ({ l: p[0], r: p[1], k: itemKey(t, i) }))).slice(0, 5);
  return { type: 'match', topic: t.id, prompt: 'Uní cada par', pairs, keys: pairs.map(p => p.k) };
}
function buildSession(mode, topicId) {
  let pool = [];
  if (mode === 'topic') {
    const t = topicById(topicId);
    pool = t.items.map((_, i) => [t, i]);
  } else if (mode === 'mixed') {
    TOPICS.forEach(t => t.items.forEach((_, i) => pool.push([t, i])));
  } else if (mode === 'missed') {
    Object.keys(state.missed).forEach(k => { const [id, i] = k.split(':'); const t = topicById(id); if (t && t.items[+i]) pool.push([t, +i]); });
  }
  const sel = shuffle(pool).slice(0, 10);
  const qs = sel.map(([t, i]) => questionFor(t, i));
  const matchable = mode === 'topic' ? topicById(topicId) : pick(TOPICS.filter(t => t.match));
  if (matchable && matchable.match && qs.length >= 4 && mode !== 'missed') {
    qs.splice(Math.floor(Math.random() * (qs.length - 1)) + 1, 0, matchQuestion(matchable));
  }
  return qs;
}

/* ---------- Play ---------- */
function startSession(mode, topicId) {
  const qs = buildSession(mode, topicId);
  if (!qs.length) { toast('No hay errores para repasar'); return; }
  session = { mode, topicId, qs, i: 0, correct: 0, streak: 0, results: [] };
  go({ screen: 'play' });
}
function renderPlay() {
  const q = session.qs[session.i];
  const t = topicById(q.topic);
  const label = session.mode === 'mixed' ? 'Práctica mixta' : session.mode === 'missed' ? 'Repaso de errores' : t.title;
  const pct = Math.round(100 * session.i / session.qs.length);
  app.innerHTML = `
    <div class="session">
      <div class="session-top">
        <button class="btn ghost sm" data-act="quit" title="Volver al inicio">✕</button>
        <div class="progress"><div class="eyebrow">${esc(label)}${session.mode !== 'topic' ? ` · ${esc(t.title)}` : ''}</div><div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div></div>
        <span class="count">${session.i + 1}/${session.qs.length}${session.streak >= 3 ? ` · 🔥${session.streak}` : ''}</span>
      </div>
      <div class="card" id="card"></div>
    </div>`;
  app.querySelector('[data-act="quit"]').addEventListener('click', () => go({ screen: 'home' }));
  const card = document.getElementById('card');
  if (q.type === 'mc') renderMC(card, q);
  else if (q.type === 'type') renderTyped(card, q);
  else renderMatch(card, q);
}

function feedbackHTML(ok, q, extra) {
  return `<div class="feedback ${ok ? 'good' : 'bad'}">
    <div class="title">${ok ? pick(['¡Bien!', 'Buenísimo', 'Correcto', 'Fantástico']) : 'Casi'}</div>
    ${extra ? `<div>${extra}</div>` : ''}
    ${q.explain ? `<div>${q.explain}</div>` : ''}
    <button class="btn primary next" data-act="next">${session.i + 1 < session.qs.length ? 'Siguiente →' : 'Ver resultado'}</button>
  </div>`;
}
function finishQuestion(card, q, ok, extra) {
  session.results.push({ q, ok });
  if (ok) { session.correct++; session.streak++; } else session.streak = 0;
  recordAnswer(q.topic, q.keys, ok);
  card.insertAdjacentHTML('beforeend', feedbackHTML(ok, q, extra));
  const nb = card.querySelector('[data-act="next"]');
  nb.focus();
  nb.addEventListener('click', nextQuestion);
}
function nextQuestion() {
  session.i++;
  if (session.i >= session.qs.length) { touchStreak(); if (session.correct === session.qs.length) { state.xp += 20; save(); } go({ screen: 'result' }); }
  else go({ screen: 'play' });
}

function renderMC(card, q) {
  card.innerHTML = `
    <div class="prompt">${q.prompt}</div>
    ${q.big ? `<div class="big">${q.big}</div>` : ''}
    <div class="options">${q.options.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  const btns = [...card.querySelectorAll('.opt')];
  const answer = idx => {
    if (card.dataset.done) return;
    card.dataset.done = '1';
    const chosen = q.options[idx];
    const ok = chosen === q.answer;
    btns.forEach((b, i) => { b.disabled = true; if (q.options[i] === q.answer) b.classList.add('good'); else if (i === idx) b.classList.add('bad'); });
    finishQuestion(card, q, ok, ok ? '' : `La respuesta era: <b>${esc(q.answer)}</b>`);
  };
  btns.forEach(b => b.addEventListener('click', () => answer(+b.dataset.i)));
  card._keys = e => { const n = +e.key; if (n >= 1 && n <= q.options.length && !card.dataset.done) answer(n - 1); };
}

function renderTyped(card, q) {
  const cam = q.cam;
  const formHTML = cam
    ? `<div class="keyword"><span class="eyebrow">Palabra clave</span><span class="key">${esc(cam.key)}</span></div>
       <form class="typed cam" autocomplete="off">
         <span class="pre">${esc(cam.pre)}</span><input type="text" id="ans" placeholder="…" autocapitalize="off" spellcheck="false" aria-label="Palabras que faltan"><span class="post">${esc(cam.post)}</span>
         <button class="btn primary" type="submit">Comprobar</button>
       </form>`
    : `<form class="typed ${q.stem ? 'with-stem' : ''}" autocomplete="off">${q.stem ? `<span class="stem">${esc(q.stem)}</span>` : ''}<input type="text" id="ans" placeholder="${q.stem ? 'continuá la oración…' : 'Escribí acá…'}" autocapitalize="off" spellcheck="false"><button class="btn primary" type="submit">Comprobar</button></form>`;
  card.innerHTML = `
    <div class="prompt">${q.prompt}</div>
    ${q.big ? `<div class="big">${q.big}</div>` : ''}
    ${formHTML}
    <div class="hint" id="hint">${q.hint ? `${cam ? '' : 'Pista: '}${esc(q.hint)}` : ''}</div>
    <div class="helper"><button class="btn ghost sm" type="button" data-act="letters">Mostrar letras</button><button class="btn ghost sm" type="button" data-act="giveup">No sé</button></div>`;
  const input = card.querySelector('#ans'); input.focus();
  const form = card.querySelector('form');
  const hint = card.querySelector('#hint');
  const warn = msg => { hint.textContent = msg; hint.classList.add('warn'); input.focus(); };
  const done = ok => {
    if (card.dataset.done) return;
    card.dataset.done = '1';
    input.disabled = true; form.querySelector('button').disabled = true;
    card.querySelectorAll('.helper button').forEach(b => b.disabled = true);
    finishQuestion(card, q, ok, ok || q.flex ? '' : `La respuesta era: <b>${esc(modelAnswer(q))}</b>`);
  };
  form.addEventListener('submit', e => {
    e.preventDefault();
    const raw = input.value.trim(); if (!norm(raw)) return;
    if (cam) {
      // Reglas del examen: la clave tiene que estar tal cual, y el conteo de palabras dentro del rango
      if (!hasKey(raw, cam.key)) return warn(`Tenés que usar la palabra clave ${cam.key} sin modificarla.`);
      const n = wordCount(raw);
      if (n < cam.min || n > cam.max) return warn(`Usaste ${n} ${n === 1 ? 'palabra' : 'palabras'}. Tienen que ser entre ${cam.min} y ${cam.max}, y las contracciones cuentan como dos.`);
    }
    done(q.flex ? matchFlex(raw, q.answers) : q.answers.some(a => norm(a) === norm(raw)));
  });
  card.querySelector('[data-act="letters"]').addEventListener('click', () => {
    const a = q.answers[0];
    hint.classList.remove('warn');
    hint.textContent = a.split(' ').map(w => w[0] + '·'.repeat(Math.max(0, w.length - 1))).join(' ');
  });
  card.querySelector('[data-act="giveup"]').addEventListener('click', () => done(false));
}
function renderMatch(card, q) {
  const lefts = shuffle(q.pairs), rights = shuffle(q.pairs);
  card.innerHTML = `
    <div class="prompt">${q.prompt} · tocá uno de la izquierda y después su par</div>
    <div class="match">
      <div class="col">${lefts.map((p, i) => `<button class="tile" data-side="l" data-i="${i}">${esc(p.l)}</button>`).join('')}</div>
      <div class="col">${rights.map((p, i) => `<button class="tile" data-side="r" data-i="${i}">${esc(p.r)}</button>`).join('')}</div>
    </div>
    <div class="match-foot"><span class="muted num" id="mistakes">0 errores</span></div>`;
  let sel = null, mistakes = 0, matched = 0; const missedKeys = new Set();
  const tiles = [...card.querySelectorAll('.tile')];
  tiles.forEach(tile => tile.addEventListener('click', () => {
    if (tile.classList.contains('done')) return;
    const side = tile.dataset.side, i = +tile.dataset.i;
    if (side === 'l') { tiles.forEach(x => x.classList.remove('sel')); tile.classList.add('sel'); sel = i; return; }
    if (sel === null) { toast('Primero elegí uno de la izquierda'); return; }
    const L = lefts[sel], R = rights[i];
    if (L.r === R.r) {
      tile.classList.add('done'); tile.disabled = true;
      const lt = tiles.find(x => x.dataset.side === 'l' && +x.dataset.i === sel); lt.classList.remove('sel'); lt.classList.add('done'); lt.disabled = true;
      sel = null; matched++;
      if (matched === q.pairs.length) {
        const ok = mistakes === 0;
        session.results.push({ q, ok });
        if (ok) { session.correct++; session.streak++; } else session.streak = 0;
        const s = tstat(q.topic); s.attempts++; if (ok) s.correct++;
        q.pairs.forEach(p => { if (missedKeys.has(p.k)) state.missed[p.k] = (state.missed[p.k] || 0) + 1; else if (state.missed[p.k]) { state.missed[p.k]--; if (state.missed[p.k] <= 0) delete state.missed[p.k]; } });
        if (ok) state.xp += 10; save();
        card.insertAdjacentHTML('beforeend', feedbackHTML(ok, q, ok ? 'Todos los pares sin errores.' : `Terminaste con ${mistakes} ${mistakes === 1 ? 'error' : 'errores'}. Los pares fallados quedan para repasar.`));
        const nb = card.querySelector('[data-act="next"]'); nb.focus(); nb.addEventListener('click', nextQuestion);
      }
    } else {
      mistakes++; missedKeys.add(L.k);
      document.getElementById('mistakes').textContent = `${mistakes} ${mistakes === 1 ? 'error' : 'errores'}`;
      tile.classList.add('shake'); setTimeout(() => tile.classList.remove('shake'), 350);
    }
  }));
}

/* ---------- Result ---------- */
function renderResult() {
  const n = session.qs.length, c = session.correct;
  const perfect = c === n;
  const missed = session.results.filter(r => !r.ok);
  const xpGain = c * 10 + (perfect ? 20 : 0);
  app.innerHTML = `
    <div class="session result">
      <div class="eyebrow">Sesión terminada</div>
      <h2>${perfect ? '¡Sesión perfecta!' : c >= n * 0.7 ? 'Muy bien' : 'A seguir practicando'}</h2>
      <div class="score">${c}<small> / ${n}</small></div>
      <div class="muted">+${xpGain} XP · racha diaria: ${state.streak} ${state.streak === 1 ? 'día' : 'días'}</div>
      ${missed.length ? `<div><div class="eyebrow" style="text-align:left;margin-bottom:6px">Para repasar</div><ul class="missed">${missed.map(r => `<li>${r.q.type === 'match' ? 'Matching: ' + esc(topicById(r.q.topic).title) : `${r.q.prompt}${r.q.big ? ' — ' + r.q.big : ''} → <b>${esc(r.q.type === 'mc' ? r.q.answer : modelAnswer(r.q))}</b>`}</li>`).join('')}</ul></div>` : ''}
      <div class="row">
        <button class="btn primary" data-act="again">Otra vez</button>
        <button class="btn mark" data-act="missed" ${missedCount() ? '' : 'disabled'}>Repasar errores (${missedCount()})</button>
        <button class="btn" data-act="home">Inicio</button>
      </div>
    </div>`;
  app.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
    const act = b.dataset.act;
    if (act === 'again') startSession(session.mode, session.topicId);
    if (act === 'missed') startSession('missed');
    if (act === 'home') go({ screen: 'home' });
  }));
}

/* ---------- Teclado ---------- */
document.addEventListener('keydown', e => {
  if (view.screen === 'learn') {
    if (e.key === ' ') { e.preventDefault(); document.getElementById('flash').click(); }
    if (e.key === 'ArrowRight' && view.i < topicById(view.topic).cards(topicById(view.topic)).length - 1) go({ ...view, i: view.i + 1, flipped: false });
    if (e.key === 'ArrowLeft' && view.i > 0) go({ ...view, i: view.i - 1, flipped: false });
  }
  if (view.screen === 'play') {
    const card = document.getElementById('card');
    if (e.target.tagName === 'INPUT') return;
    if (card && card._keys) card._keys(e);
    if (e.key === 'Enter' && card && card.dataset.done) { const nb = card.querySelector('[data-act="next"]'); if (nb && document.activeElement !== nb) nb.click(); }
  }
});

render();
</script>
</body>
</html>
